# FiLM-ResNet trained on static aberrations, initial frame as reference frame (Fig. 5(a), Table S1).
# Training was stopped after 1121 of the 2000 scheduled iterations.
name = "film_resnet_static"
seed = 20261021

# settings of the released weights; the rollout batch changes the random stream
[run]
inputs = "full"
rollout_batch = 32
micro_batch = 32
max_iterations = 1121

[optics]
wavelength_m = 1.08e-06
focal_length_m = 5.0
pixel_pitch_m = 5.86e-06
exit_aperture_m = 0.105
fft_size = 384
pupil_pixels = 44
roi_half_lambda_over_d = 10.0
network_image_size = 128
diversity_defocus_rad = 0.0
noll_start = 4
nmodes = 33

[turbulence]
screen_size = 1024
outer_scale_over_d = 10.0
inner_scale_over_d = 0.01
subharmonics = true
d_over_r0_range = [4.0, 4.0]
tau_ratio_range = [0.03, 1.0]

[camera]
photons_range = [100.0, 1000000.0]
read_noise_e = 7.0
asinh_scale = 0.02

[reference]
mode = "initial"
phase_mode = "static_modal_33"
static_rms_range = [0.4, 1.2]
static_shape_d_over_r0 = 4.0
read_noise_choices_e = [0.0, 7.0]
static_validation_rms = [0.4, 0.8, 1.2]
static_validation_read_noise_e = [0.0, 7.0]
static_validation_photons = [100.0, 1000.0, 10000.0, 100000.0, 1000000.0]

[loop]
gain = 0.5
command_delay_frames = 1
frames_per_episode = 11
probe_defocus_rad = 0.2
command_limit_rad = 3.0

[dagger]
iterations = 2000
episodes_per_iteration = 256
rollout_batch = 256
updates_per_iteration = 40
batch_size = 512
buffer_capacity = 120000
warmup_iterations = 100
warmup_oracle_noise_rad = 0.3
oracle_noise_rad = 0.05
beta_start = 0.8
beta_end = 0.0
beta_decay_iterations = 800
curriculum_iterations = 600
curriculum_start_d_over_r0_max = 4.0
curriculum_start_tau_ratio_max = 0.3

[model]
name = "film_resnet"
widths = [32, 64, 128, 256]
blocks = [2, 2, 2, 2]
condition_dim = 128
groups = 8

[training]
learning_rate = 0.0003
weight_decay = 0.0001
warmup_updates = 1000
gradient_clip_norm = 1.0
loss_floor_rad = 0.05
final_lr_fraction = 0.05
device = "cuda"
precision = "bf16"

[evaluation]
interval = 50
checkpoint_interval = 50
seed = 910000
episodes_per_cell = 32
frames_per_episode = 11
steady_frames = 3
d_over_r0 = [4.0]
tau_ratio = [0.0]
photons = [100.0, 1000.0, 10000.0, 100000.0, 1000000.0]
